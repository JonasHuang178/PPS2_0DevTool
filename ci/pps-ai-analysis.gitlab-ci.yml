# PPS2_0DevTool —— AI Analysis GitLab MR 五步流程（GitLab CI）
#
# 複製到 repo 根目錄改名 .gitlab-ci.yml。
#
# 一個 stage、一個 job、五步照順序跑。任一步 exit 非 0 就整個 job 失敗並停下來
# （GitLab 的 script 是一份 shell 腳本，前一行失敗就不會執行下一行）。
#
# 投遞方式：每一步寫一份請求 JSON，用 --request 餵給腳本。
#   stdout = 結果 JSON（PASS/FAIL），直接留在 job log
#   stderr = 診斷與進度，也留在 log
#   exit 0 = PASS   exit 1 = FAIL   exit 2 = 用法錯誤
#
# log 不必做任何事就會出現在 job log（= GitLab CI/CD 頁面）—— logger 的每一個等級
# 都走 stderr，而 job log 同時收 stdout 與 stderr。工具端 debug console 看到的
# [ PY INFO ] / [ PY WARN ] 那些行，在這裡一字不差。
#
# -v 打開 DEBUG 等級（預設只到 INFO）。想少一點雜訊就把它拿掉。
# ⚠️ job log 有大小上限（預設 4 MB，Admin → CI/CD → output_limit）。-v 加上一支大
#    MR 有可能撞到，撞到的話尾端會被截掉 —— 那正是結果 JSON 所在的位置。
#
# 步驟之間不靠 stdout 傳值，靠 out_path 寫出來的檔案 —— jira_key 與 mr_type 在
# 02_mr_info.json，jira_state 在 03_summary.json。
#
# 不需要設 PYTHONPATH，每支腳本自己 bootstrap sys.path。
#
# 要先設成 CI/CD Variables（Masked + Protected）：
#   GITLAB_ACCESS_TOKEN  JIRA_ACCESS_TOKEN  AI_API_URL  AI_API_KEY
#
# AI_API_URL 是連線字串 provider:端點:shareCode，例如
#   openai:https://ai.example.com/api/external/v1/chat:SHARE_CODE
# provider 可以省略（只寫 端點:shareCode），照樣能跑，只是報告出處少了 provider。
# 模型名稱不必設：步驟 3 會向 AI 服務查，報告出處印的就是查到的那一個。

stages:
  - ai-analysis

ai-analysis:
  stage: ai-analysis
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

  variables:
    S: "$CI_PROJECT_DIR/scripts/ai_analysis_gitlab_mr"   # 腳本所在目錄
    W: "$CI_PROJECT_DIR/pps-work"                        # 五步的產物
    D: "$CI_PROJECT_DIR/pps-work/logs"                   # 執行紀錄，空字串=不寫
    # 送進腳本的請求 JSON。**刻意不在 pps-work/ 之下** —— 那是 artifact 的收集路徑，而步驟 3
    # 的請求 JSON 含有 AI 金鑰與 shareCode。讓真憑證從頭就不進該路徑，比寫進去再刪掉可靠：
    # 刪除要靠每一條失敗路徑都執行到，而改名時最容易漏掉的就是那幾行刪除。
    #
    # artifact 裡留下的是腳本自己寫出的**遮罩版**（pps-work/logs/requests/）。
    R: "$CI_PROJECT_DIR/pps-requests"

    # 服務端點
    GITLAB_SERVER_URL: "$CI_SERVER_URL"
    GITLAB_VERIFY_SSL: "false"
    JIRA_SERVER_URL: "https://jira.example.com"

    PPS_DEVICE: "default"                                 # 步驟 2/3/4/5 都要
    PPS_SCRIPTS_CODEREVIEW_FILE_STARTSWITH: "CodeReview_" # 步驟 4 必填
    AI_VERIFY_SSL: "false"

    # 不送進 AI 分析的檔案。多個值用分號分隔，區分大小寫，留空不排除。
    PPS_PROJECT_AI_ANALYSIS_SKIP_FILENAMES: ""
    PPS_PROJECT_AI_ANALYSIS_SKIP_EXTENSIONS: "json;ts;png;svg"
    PPS_PROJECT_AI_ANALYSIS_SKIP_DIRS: "third_party"


  script:
    - mkdir -p "$W" "$D" "$R"
    - REPO="$CI_MERGE_REQUEST_PROJECT_PATH"
    - IID="$CI_MERGE_REQUEST_IID"

    # GitLab 的可收合區段：五步各自成一塊，可以折疊，而且標題旁會顯示那一步的耗時。
    # 名稱只能用英數與下底線。\e[0K 是清到行尾，少了它那串控制碼會印出來。
    - |
      sec() { echo -e "\e[0Ksection_start:$(date +%s):$1\r\e[0K$2"; }
      end() { echo -e "\e[0Ksection_end:$(date +%s):$1\r\e[0K"; }

    # --- 步驟 1/5：取得 MR 描述 -> 01_description.md ---------------------------
    # 產物已扣掉上一輪貼進去的 AI 分析；不扣的話 AI 會對自己上次的輸出再分析一次。
    - |
      cat > "$R/req1.json" <<EOF
      {"action": "mr_description", "config": {}, "params": {
        "repo": "$REPO", "mr_iid": "$IID",
        "log_dir": "$D", "out_path": "$W/01_description.md"}}
      EOF
    - sec pps1 "步驟 1/5：取得 MR 描述"
    - python3 "$S/ai_analysis_gitlab_mr_description.py" --request "$R/req1.json" -v
    - end pps1

    # --- 步驟 2/5：JIRA key 與 MR 種類 -> 02_mr_info.json ----------------------
    # 這一步自己連 GitLab 取 MR（擷取 key 讀的是標題，步驟 1 的產物只有描述本文）。
    # jira_mode: auto 從標題第一個方括號擷取 / manual 用 jira_key_manual / none 不用。
    - |
      cat > "$R/req2.json" <<EOF
      {"action": "mr_info", "config": {}, "params": {
        "repo": "$REPO", "mr_iid": "$IID",
        "jira_mode": "auto", "jira_key_manual": "",
        "log_dir": "$D", "out_path": "$W/02_mr_info.json"}}
      EOF
    - sec pps2 "步驟 2/5：JIRA key 與 MR 種類"
    - python3 "$S/ai_analysis_gitlab_mr_info.py" --request "$R/req2.json" -v
    - end pps2
    - JIRA_KEY=$(python3 -c "import json,os;print(json.load(open(os.environ['W']+'/02_mr_info.json'))['jira_key'])")
    - MR_TYPE=$(python3 -c "import json,os;print(json.load(open(os.environ['W']+'/02_mr_info.json'))['mr_type'])")

    # --- 步驟 3/5：AI 分析 -> 03_summary.json ---------------------------------
    # 唯一要錢、唯一要等分鐘級的一步。
    # 描述走 description_path 不走 description（CI 手上有的是檔案）。
    # AI 的連線字串與金鑰走 params 不走環境變數，所以會落在 req3.json —— 它在 $R 底下，
    # 不在 artifact 路徑裡（見上面 R 的說明），所以不需要刪。
    # ai_recheck 預設 0：漏檔時不重問。要開填 "1"，每多一輪就多一次完整的 AI 呼叫。
    - |
      cat > "$R/req3.json" <<EOF
      {"action": "ai_summary", "config": {}, "params": {
        "repo": "$REPO", "mr_iid": "$IID",
        "description_path": "$W/01_description.md",
        "jira_key": "$JIRA_KEY", "jira_mode": "auto", "mr_type": "$MR_TYPE",
        "ai_connection": "$AI_API_URL", "ai_api_key": "$AI_API_KEY",
        "ai_timeout": "120", "ai_retries": "3", "ai_reask": "1", "ai_recheck": "0",
        "log_dir": "$D", "out_path": "$W/03_summary.json"}}
      EOF
    - sec pps3 "步驟 3/5：AI 分析"
    - python3 "$S/ai_analysis_gitlab_mr_summary.py" --request "$R/req3.json" -v
    - end pps3
    - JIRA_STATE=$(python3 -c "import json,os;print(json.load(open(os.environ['W']+'/03_summary.json'))['analysis']['jira_state'])")

    # --- 步驟 4/5：程式碼審閱報告 -> 04_code_review.json（可能不產生）----------
    # 這一步永遠執行，「要不要真的去抓」由它自己依 jira_key 與 jira_state 決定 ——
    # 在 CI 再判一次就有第二份規則。jira_state 來自步驟 3，不是步驟 2。
    # 沒有 key、key 無效、或議題上沒有符合的附件，都是 PASS 但不落檔。
    - rm -f "$W/04_code_review.json"
    - |
      cat > "$R/req4.json" <<EOF
      {"action": "fetch_code_review", "config": {}, "params": {
        "repo": "$REPO", "mr_iid": "$IID",
        "jira_key": "$JIRA_KEY", "jira_state": "$JIRA_STATE",
        "log_dir": "$D", "out_path": "$W/04_code_review.json"}}
      EOF
    - sec pps4 "步驟 4/5：程式碼審閱報告"
    - python3 "$S/ai_analysis_gitlab_mr_code_review.py" --request "$R/req4.json" -v
    - end pps4

    # --- 步驟 5/5：合併為 markdown -> 05_report.md ----------------------------
    # 收的是檔案路徑，不是內容。路徑給了就必須存在，所以第 4 步沒落檔時
    # code_review_json_file_path 整個鍵不放（不是放空字串）。
    # 不傳 mr_type：它已經在 03_summary.json 裡，這一步本來就要讀那份檔案。
    - |
      CR=""
      if [ -f "$W/04_code_review.json" ]; then
        CR="\"code_review_json_file_path\": \"$W/04_code_review.json\","
      fi
      cat > "$R/req5.json" <<EOF
      {"action": "merge_to_md", "config": {}, "params": {
        "ori_md_file_path": "$W/01_description.md",
        "mr_summary_json_file_path": "$W/03_summary.json",
        $CR
        "repo": "$REPO", "mr_iid": "$IID",
        "log_dir": "$D", "out_path": "$W/05_report.md"}}
      EOF
    - sec pps5 "步驟 5/5：合併為 markdown"
    - python3 "$S/ai_analysis_gitlab_mr_merge_to_md.py" --request "$R/req5.json" -v
    - end pps5
    - cat "$W/05_report.md"

  artifacts:
    when: always          # 失敗時也要留，才查得出是哪一步、少了什麼
    expire_in: 1 week
    paths:
      - pps-work/
    expose_as: "AI Analysis Report"
